name: Request Tree-sitter Language / Edge Case
description: Report a language parsing edge case or request a new tree-sitter language
title: "[Language] "
labels: ["language-support", "tree-sitter"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Request Type
      options:
        - New language support
        - Rust macro / attribute parsing
        - Python decorator parsing
        - TypeScript decorator / JSX edge case
        - Go generics / interface edge case
        - Java annotation / generic edge case
        - C/C++ macro / template edge case
        - Other
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal Code Sample
      description: Paste a minimal code snippet that demonstrates the issue
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What symbols should be extracted? What should the slice look like?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What does treecut currently produce? (run `treecut slice <symbol>` or `treecut map`)
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: treecut Version
      placeholder: "0.1.0"
    validations:
      required: true