[package]
name = "treecut"
version = "0.4.2"
edition = "2024"
description = "Local-first AST, SQLite-cached, and Git-diff context slicer for AI coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bigwalkdoe/treecut"
homepage = "https://github.com/bigwalkdoe/treecut"
documentation = "https://docs.rs/treecut"
readme = "README.md"
exclude = [
    ".github/*",
    ".treecut/*",
    "assets/*",
    "demo.tape",
    "SPEC.md",
]
keywords = ["mcp", "tree-sitter", "ast", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = ["cli", "mcp", "extra-langs"]
cli = ["dep:reqwest"]
mcp = []
extra-langs = [
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-php",
    "dep:tree-sitter-swift",
    "dep:tree-sitter-bash",
]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
git2 = { version = "0.20", default-features = false }
globset = "0.4"
ignore = "0.4"
rusqlite = { version = "0.34", features = ["bundled"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"

# New Tier-2 grammars (12 languages total)
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23.5", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.23", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
tree-sitter-bash = { version = "0.23", optional = true }

reqwest = { version = "0.13", features = ["json"], optional = true }

[dev-dependencies]
tempfile = "3.15"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "bigwalkdoe/homebrew-tap"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Path that installers should place binaries in
install-path = "CARGO_HOME"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
